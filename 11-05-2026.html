<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple JavaScript Animations</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #10172a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 90%;
        max-width: 900px;
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 30px;
        align-items: center;
      }

      h1 {
        font-size: 48px;
        margin: 0 0 15px;
      }

      p {
        color: #cbd5e1;
        line-height: 1.6;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        background: #38bdf8;
        color: #07111f;
      }

      button:hover {
        background: #facc15;
      }

      .stage {
        height: 430px;
        border: 2px solid #334155;
        border-radius: 12px;
        background: #020617;
        position: relative;
        overflow: hidden;
      }

      .title {
        position: absolute;
        top: 15px;
        left: 15px;
        color: #cbd5e1;
        font-weight: bold;
      }

      .star {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #facc15;
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 56%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 56%,
          2% 35%,
          39% 35%
        );
        animation: twinkle 1.5s infinite alternate;
      }

      .letter {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 80px;
        font-weight: bold;
        color: #facc15;
        text-shadow: 0 0 20px #facc15;
        animation: glow 1.5s infinite alternate;
      }

      .line {
        position: absolute;
        height: 4px;
        width: 180px;
        background: #38bdf8;
        box-shadow: 0 0 20px #38bdf8;
        animation: moveLine 2s infinite linear;
      }

      .meteor {
        position: absolute;
        width: 160px;
        height: 4px;
        background: linear-gradient(90deg, transparent, white);
        box-shadow: 0 0 20px white;
        transform: rotate(-35deg);
        animation: shoot 1.8s infinite linear;
      }

      @keyframes twinkle {
        from {
          transform: scale(0.6);
          opacity: 0.4;
        }

        to {
          transform: scale(1.3);
          opacity: 1;
        }
      }

      @keyframes glow {
        from {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }

        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.08);
        }
      }

      @keyframes moveLine {
        from {
          left: -200px;
        }

        to {
          left: 100%;
        }
      }

      @keyframes shoot {
        from {
          right: -200px;
          top: -60px;
        }

        to {
          right: 100%;
          top: 100%;
        }
      }

      @media (max-width: 700px) {
        .container {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 36px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Animation Buttons</h1>
        <p>
          Click a button to show a different animation. Reset clears the stage.
        </p>

        <div class="buttons">
          <button onclick="showStars()">Stars</button>
          <button onclick="showLines()">Lines</button>
          <button onclick="showShooting()">Shooting</button>
          <button onclick="resetStage()">Reset</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="title" id="title">Press a button</div>
      </div>
    </div>

    <script>
      const stage = document.getElementById("stage");
      const title = document.getElementById("title");

      function clearStage(text) {
        stage.innerHTML = "";
        stage.appendChild(title);
        title.textContent = text;
      }

      function showStars() {
        clearStage("Stars: REDDY");

        const word = document.createElement("div");
        word.className = "letter";
        word.textContent = "REDDY";
        stage.appendChild(word);

        for (let i = 0; i < 25; i++) {
          const star = document.createElement("div");
          star.className = "star";
          star.style.left = Math.random() * 90 + "%";
          star.style.top = Math.random() * 85 + "%";
          star.style.animationDelay = Math.random() * 2 + "s";
          stage.appendChild(star);
        }
      }

      function showLines() {
        clearStage("Lines Animation");

        for (let i = 0; i < 8; i++) {
          const line = document.createElement("div");
          line.className = "line";
          line.style.top = 60 + i * 38 + "px";
          line.style.animationDelay = i * 0.2 + "s";
          stage.appendChild(line);
        }
      }

      function showShooting() {
        clearStage("Epic Meteor Shower");

        for (let i = 0; i < 15; i++) {
          const meteor = document.createElement("div");
          meteor.className = "meteor";

          meteor.style.top = Math.random() * 30 + "%";
          meteor.style.left = Math.random() * 50 + 50 + "%";

          const speed = Math.random() * 2 + 1;
          meteor.style.animationDuration = speed + "s";

          meteor.style.animationDelay = Math.random() * 5 + "s";

          stage.appendChild(meteor);
        }
      }

      function resetStage() {
        clearStage("Press a button");
      }
    </script>
  </body>
</html>
