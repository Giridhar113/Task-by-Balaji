<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Color Master</title>
    <style>
      :root {
        --bg-color: #f0f2f5;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --primary-gradient: linear-gradient(90deg, #1e90ff, #2ed573);
      }

      body {
        background-color: var(--bg-color);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Progress Bar Styles */
      .progress-container {
        width: 400px;
        margin-bottom: 20px;
        text-align: center;
      }

      .progress-bar-bg {
        width: 100%;
        height: 12px;
        background: #ddd;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 8px;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: var(--primary-gradient);
        transition: width 0.4s ease;
      }

      .completed {
        background: #ffa502;
        box-shadow: 0 0 10px #ffa502;
      }

      /* Main App Layout */
      .app-container {
        display: flex;
        align-items: center;
        gap: 50px;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .preview-box {
        width: 180px;
        height: 180px;
        border-radius: 15px;
        border: 4px solid #eee;
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        margin-bottom: 20px;
        transition: var(--transition);
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      .btn-grid {
        display: flex;
        gap: 10px;
      }

      .color-btn {
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background: #eee;
        cursor: pointer;
        transition: var(--transition);
        font-weight: 600;
      }

      .color-btn:hover {
        transform: translateY(-3px);
        background: #e0e0e0;
      }

      .main-reset {
        background: #2f3542;
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        transition: var(--transition);
      }

      .main-reset:hover {
        background: #ff4757;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>

    <div class="progress-container">
      <div>Clicks: <span id="click-count">0</span> / 10</div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <div class="app-container">
      <div class="control-panel">
        <div id="box1" class="preview-box">Box 1</div>
        <div class="btn-grid">
          <button class="color-btn" onclick="handleButtonClick('box1')">Random</button>
          <button class="color-btn" onclick="handleButtonClick('box1')">Random</button>
          <button class="color-btn" onclick="handleButtonClick('box1')">Random</button>
        </div>
      </div>

      <div class="divider">
        <button class="main-reset" onclick="resetExperience()">
          <span>↺</span> RESET
        </button>
      </div>

      <div class="control-panel">
        <div id="box2" class="preview-box">Box 2</div>
        <div class="btn-grid">
          <button class="color-btn" onclick="handleButtonClick('box2')">Random</button>
          <button class="color-btn" onclick="handleButtonClick('box2')">Random</button>
          <button class="color-btn" onclick="handleButtonClick('box2')">Random</button>
        </div>
      </div>
    </div>

    <script>
      let clickCount = 0;
      const goal = 10;

      function generateRandomHex() {
        const chars = "0123456789ABCDEF";
        let color = "#";
        for (let i = 0; i < 6; i++) {
          color += chars[Math.floor(Math.random() * 16)];
        }
        return color;
      }

      function updateProgressUI() {
        const progressBar = document.getElementById("progress-fill");
        const counterText = document.getElementById("click-count");
        const percentage = Math.min((clickCount / goal) * 100, 100);

        progressBar.style.width = `${percentage}%`;
        counterText.innerText = clickCount;

        if (percentage >= 100) {
          progressBar.classList.add("completed");
        } else {
          progressBar.classList.remove("completed");
        }
      }

      function handleButtonClick(boxId) {
        const box = document.getElementById(boxId);
        const newColor = generateRandomHex();

        box.style.backgroundColor = newColor;
        box.innerText = newColor;
        box.style.borderColor = "transparent";

        clickCount++;
        updateProgressUI();
      }

      function resetExperience() {
        clickCount = 0;
        ["box1", "box2"].forEach((id) => {
          const el = document.getElementById(id);
          el.style.backgroundColor = "white";
          el.style.borderColor = "#eee";
          el.innerText = id.toUpperCase();
        });
        updateProgressUI();
      }
    </script>
  </body>
</html>
